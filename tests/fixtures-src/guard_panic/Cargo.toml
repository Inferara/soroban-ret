# Source for the `tests/fixtures/test_guard_panic.wasm` fixture (issue #80).
#
# A `panic_with_error!` validation guard in a SMALL contract: with nothing for
# the SDK to inline the error path into, `Env::fail_with_error` survives as a
# two-level wrapper chain and its `&self` receiver is frame-pointer arithmetic
# whose `Val` result is dropped. Both made the lifter's `fail_with_error` tail
# recognizers miss the tail, and the whole guard vanished with no `todo!()`
# marker — a silent-wrong. Built once and the resulting wasm is committed under
# tests/fixtures/; see tests/fixtures/README.md. Standalone (`[workspace]`) so
# it is not pulled into the main cargo workspace.
[package]
name = "test_guard_panic"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]
doctest = false

[dependencies]
soroban-sdk = "=26.0.1"

# Match the canonical Soroban release profile (overflow-checks on), as the
# equivalence harness recompiles with the same setting.
[profile.release]
overflow-checks = true

[workspace]
