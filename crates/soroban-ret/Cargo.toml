[package]
name = "soroban-ret"
description = "Stellar Soroban Smart Contracts Reverse Engineering Tool"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
soroban-spec = { workspace = true }
soroban-meta = { workspace = true }
soroban-spec-rust = { workspace = true }
stellar-xdr = { workspace = true }
wasmparser = { workspace = true }
proc-macro2 = { workspace = true }
quote = { workspace = true }
syn = { workspace = true }
prettyplease = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
cov-mark = { workspace = true }
wasmprinter = { workspace = true, optional = true }
serde = { workspace = true, optional = true }

[features]
# Derive `Serialize`/`Deserialize` on the `recovery` types so embedders can ship
# the per-contract signals to a UI as JSON. Off by default: the core library has
# no need to serialize anything, and library users shouldn't pay for serde.
serde = ["dep:serde"]

[dev-dependencies]
insta = "1.40"
wat = "1"
